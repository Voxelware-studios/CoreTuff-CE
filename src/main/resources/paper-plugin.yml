name: CoreTuff-CE
version: ${version}
main: org.voxelware.coretuff.CoreTuff
api-version: '26.2'
authors: [Voxelware Studios]
website: https://voxelware.org/

loader: org.voxelware.coretuff.dependencyresolver

folia-supported: true

description: CoreTuff Community Edition - A complete Minecraft server utility plugin.

dependencies:

  bootstrap:
    - com.h2database:h2:2.4.240
    - org.spongepowered:configurate-yaml:4.1.2
    - org.projectlombok:lombok:1.18.46

  server:
    Vault:
      load: BEFORE
      required: false
    PlaceholderAPI:
      load: BEFORE
      required: false
    ProtocolLib:
     load: BEFORE
     required: false
    packetevents:
      load: BEFORE
      required: false


commands:

  coretuff:
    description: CoreTuff admin command
    aliases: [ct]

  home:
    description: Teleport to a home
    usage: "/home <home>"
    permission: coretuff.land.home

  sethome:
    description: Set a home
    usage: "/sethome <home>"
    permission: coretuff.land.sethome

  delhome:
    description: Delete a home
    usage: "/delhome <home>"
    permission: coretuff.land.delhome

  # Warps

  warp:
    description: Teleport to a warp
    usage: "/warp <name> [player]"
    permission: coretuff.land.warps.warp

  setwarp:
    description: Create or update a warp
    usage: "/setwarp <name> [description]"
    permission: coretuff.land.warps.setwarp

  delwarp:
    description: Delete a warp
    usage: "/delwarp <name>"
    permission: coretuff.land.warps.delwarp

  warps:
    description: List all warps
    usage: "/warps [page]"
    permission: coretuff.land.warps.list

  # Moderation

  ban:
    description: Permanently ban a player
    usage: "/ban <player> <reason>"
    permission: coretuff.moderation.ban

  tempban:
    description: Temporarily ban a player
    usage: "/tempban <player> <duration> <reason>"
    permission: coretuff.moderation.tempban

  ban-ip:
    description: Ban a player's IP address
    usage: "/ban-ip <player/ip> <reason>"
    permission: coretuff.moderation.banip

  pardon:
    description: Pardon a punishment
    usage: "/pardon <player>"
    permission: coretuff.moderation.pardon

  kick:
    description: Kick a player
    usage: "/kick <player> <reason>"
    permission: coretuff.moderation.kick

  warn:
    description: Warn a player
    usage: "/warn <player> <low|medium|high> <reason>"
    permission: coretuff.moderation.warn

  pid:
    description: Punishment ID management
    usage: "/pid [view|pardon]"
    permission: coretuff.moderation.pid

  # Gamemode

  gmc:
    description: Set creative mode
    usage: "/gmc [player]"
    permission: coretuff.gamemode.gmc

  gms:
    description: Set survival mode
    usage: "/gms [player]"
    permission: coretuff.gamemode.gms

  gma:
    description: Set adventure mode
    usage: "/gma [player]"
    permission: coretuff.gamemode.gma

  gmsp:
    description: Set spectator mode
    usage: "/gmsp [player]"
    permission: coretuff.gamemode.gmsp


  # Utility

  fly:
    description: Toggle flight
    usage: "/fly [player]"
    permission: coretuff.utility.fly

  heal:
    description: Heal yourself or others
    usage: "/heal [player]"
    permission: coretuff.utility.heal

  feed:
    description: Feed yourself or others
    usage: "/feed [player]"
    permission: coretuff.utility.feed

  hat:
    description: Wear held item as hat
    usage: "/hat"
    permission: coretuff.utility.hat

  anvil:
    description: To open anvil UI
    usage: "/anvil"
    permission: coretuff.utility.anvil

  stonecutter:
    description: To open Stone Cutter UI
    usage: "/stonecutter"
    permission: coretuff.utility.stonecutter

  smithing:
    description: To open Smithing Table menu
    usage: "/crafting"
    permission: coretuff.utility.smithingtable

  loom:
    description: To open loom menu
    usage: "/loom"
    permission: coretuff.utility.loom

  cartography:
    description: To open Cartogtaphy menu
    usage: "/cartography"
    permission: coretuff.utility.cartographytable

  enchanting:
    description: To open Enchanting Table menu
    usage: "/enchanting"
    permission: coretuff.utility.enchantingtable

  grindstone:
    description: To open Grindstone menu
    usage: "/grindstone"
    permission: coretuff.utility.grindstone

  crafting:
    description: To open 3x3 Crafting menu
    usage: "/crafting"
    permission: coretuff.utility.craftingtable

  # Teleportation

  tpa:
    description: Send teleport request
    usage: "/tpa <player>"
    permission: coretuff.teleportation.tpask

  tphere:
    description: Request someone to teleport to you
    usage: "/tphere <player>"
    permission: coretuff.teleportation.tphere

  tpaccept:
    description: Accept teleport request
    usage: "/tpaccept"
    permission: coretuff.teleportation.tpaccept

  tpdeny:
    description: Deny teleport request
    usage: "/tpdeny"
    permission: coretuff.teleportation.tpdeny

  rtp:
    description: Random teleport
    usage: "/rtp [world]"
    permission: coretuff.teleportation.rtp

  back:
    description: Teleport back
    usage: "/back"
    permission: coretuff.teleportation.back

  tpignore:
    description: Ignore teleport requests
    usage: "/tpignore <player>"
    permission: coretuff.teleportation.tpignore

  # Moderation - Jail

  jail:
    description: Jail a player
    usage: "/jail <name> [player]"
    permission: coretuff.moderation.jail.jail

  setjail:
    description: Create or update a jail location
    usage: "/setjail <name>"
    permission: coretuff.moderation.jail.setjail

  deljail:
    description: Delete a jail
    usage: "/deljail <name>"
    permission: coretuff.moderation.jail.deljail

  jails:
    description: List all jails
    usage: "/jails"
    permission: coretuff.moderation.jail.list

  # Utility - Kits

  kit:
    description: Redeem a kit
    usage: "/kit <name> [player]"
    permission: coretuff.utility.kit

  kits:
    description: List available kits
    usage: "/kits"
    permission: coretuff.utility.kit.list

  # Economy

  balance:
    description: Check your balance
    usage: "/balance [player]"
    permission: coretuff.economy.balance

  pay:
    description: Pay another player
    usage: "/pay <player> <amount>"
    permission: coretuff.economy.pay

  eco:
    description: Admin economy management
    usage: "/eco <give|take|set|reset> <player> <amount>"
    permission: coretuff.economy.admin

  tpunignore:
    description: Unignore teleport requests
    usage: "/tpunignore <player>"
    permission: coretuff.teleportation.tpunignore

permissions:

  coretuff:
    default: op
    children:
      coretuff.dump: true
      coretuff.admin.dump: true

  coretuff.reload:
    default: op

  coretuff.dump:
    default: op

  coretuff.admin.dump:
    default: op

  # Moderation

  coretuff.moderation:
    default: op
