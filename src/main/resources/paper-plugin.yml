      coretuff.utility.hat: true
      coretuff.utility.craftingtable: true
      coretuff.utility.anvil: true
      coretuff.utility.stonecutter: true
      coretuff.utility.smithingtable: true
      coretuff.utility.loom: true
      coretuff.utility.cartographytable: true
      coretuff.utility.enchantingtable: true
      coretuff.utility.grindstone: true
