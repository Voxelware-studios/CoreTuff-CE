  coretuff.utility.heal.others:
    default: op

  coretuff.utility.feed:
    default: op

  coretuff.utility.feed.others:
    default: op

  coretuff.utility.hat:
    default: op

  coretuff.utility.craftingtable:
    default: op

  coretuff.utility.anvil:
    default: op

  coretuff.utility.stonecutter:
    default: op

  coretuff.utility.smithingtable:
    default: op

  coretuff.utility.loom:
